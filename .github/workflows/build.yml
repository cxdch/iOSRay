# Сборка XRProbe на облачном Mac (GitHub Actions, бесплатно для публичных репозиториев).
# Результат: IPA для SideStore и TIPA для TrollStore — в артефактах и в релизе "nightly",
# откуда их можно скачать прямо на iPhone.
name: build

on:
  push:
    branches: [main, metal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Зафиксированный коммит OpenXRay, из которого берутся GL-шейдеры для теста.
  OPENXRAY_REV: ddb78a5cfbe6719f4b5abe371e3fdeed0f3481fc

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Инструменты
        run: |
          brew install glslang spirv-cross ldid
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: GL-шейдеры OpenXRay
        run: |
          git init -q xray-16
          cd xray-16
          git remote add origin https://github.com/OpenXRay/xray-16.git
          git sparse-checkout set res/gamedata/shaders/gl
          git fetch -q --depth 1 --filter=blob:none origin "$OPENXRAY_REV"
          git checkout -q FETCH_HEAD

      - name: GLSL → SPIR-V → MSL
        run: |
          python3 -I scripts/convert_shaders.py xray-16/res/gamedata/shaders/gl shaders-out \
            "$(command -v glslangValidator)" "$(command -v spirv-cross)" | tee shader-report.txt

      - name: Офлайн-сборка xrshaders.metallib
        run: set -o pipefail; bash scripts/build_metallib.sh shaders-out/high build/xrshaders.metallib | tee -a shader-report.txt

      - name: Сборка IPA
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}" BUILD="${GITHUB_RUN_NUMBER}" \
            bash scripts/build_ipa.sh shaders-out/high

      - uses: actions/upload-artifact@v4
        with:
          name: XRProbe-${{ github.run_number }}
          path: |
            build/*.ipa
            build/*.tipa
            build/*.dSYM
            build/xrshaders.metallib
            shader-report.txt
            shaders-out/report.json

      - name: Релиз nightly
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly build/*.ipa build/*.tipa shader-report.txt \
            --prerelease --target "$GITHUB_SHA" --title "XRProbe nightly #${GITHUB_RUN_NUMBER}" \
            --notes "Сборка ${GITHUB_SHA::7}. IPA — для SideStore, TIPA — для TrollStore."

  engine:
    # Движок OpenXRay под iOS arm64: зависимости → исходники с патчами → сборка → IPA.
    needs: ios          # релиз nightly создаёт job ios; движок добавляет в него свои файлы
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Инструменты
        run: brew install ninja ldid

      - name: Кэш зависимостей
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: build/ios-prefix
          key: ios-deps-${{ hashFiles('scripts/build_deps_ios.sh', 'deps/**', 'cmake/ios.toolchain.cmake') }}

      - name: Зависимости (SDL2, OpenAL Soft, Ogg/Vorbis/Theora, LZO, LuaJIT)
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_deps_ios.sh

      - name: Исходники OpenXRay + патчи
        run: bash scripts/fetch_openxray.sh

      - name: Сборка движка
        run: bash scripts/build_engine_ios.sh

      - name: IPA движка
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}" BUILD="${GITHUB_RUN_NUMBER}" bash scripts/package_engine_ipa.sh

      - name: Добавить в релиз nightly
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload nightly build/iOSRay-sidestore.ipa build/iOSRay-trollstore.tipa --clobber

      - name: Отчёт
        if: always()
        run: |
          mkdir -p report
          cp build/engine/build.log report/ 2>/dev/null || true
          grep -E "error:" build/engine/build.log | sort | uniq -c | sort -rn > report/errors.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-ios-${{ github.run_number }}
          path: report/
