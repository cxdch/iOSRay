[package]
name = "xr_texcodec"
version = "0.1.0"
edition = "2024"
description = "iOSRay: безопасная распаковка BC1–BC5 (DXT) и проверка кэша ASTC (.xra) для OpenXRay"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
